name: SideStore IPA Release

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: "Release note sent with the IPA in Telegram"
        required: false
        default: "36OS Mobile Node — unsigned IPA for SideStore."

permissions:
  contents: read

jobs:
  build-and-send:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Build unsigned iOS device archive
        run: |
          xcodebuild \
            -project 36OSMobileNode.xcodeproj \
            -scheme 36OSMobileNode \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/36OSMobileNode.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION=0.1.0 \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            archive

      - name: Package unsigned IPA
        run: |
          APP_PATH="$RUNNER_TEMP/36OSMobileNode.xcarchive/Products/Applications/36OSMobileNode.app"
          test -d "$APP_PATH"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/ipa/Payload/"
          cd "$RUNNER_TEMP/ipa"
          /usr/bin/zip -qry "$GITHUB_WORKSPACE/36OSMobileNode-unsigned.ipa" Payload
          test -s "$GITHUB_WORKSPACE/36OSMobileNode-unsigned.ipa"
          shasum -a 256 "$GITHUB_WORKSPACE/36OSMobileNode-unsigned.ipa"

      - name: Upload IPA as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: 36OSMobileNode-unsigned-ipa
          path: 36OSMobileNode-unsigned.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Send IPA to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RELEASE_NOTES: ${{ github.event.inputs.release_notes || '36OS Mobile Node IPA is ready for SideStore.' }}
        run: |
          test -n "$TELEGRAM_BOT_TOKEN"
          test -n "$TELEGRAM_CHAT_ID"
          curl --fail --silent --show-error \
            --request POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
            --form "chat_id=${TELEGRAM_CHAT_ID}" \
            --form "caption=${RELEASE_NOTES}" \
            --form "document=@36OSMobileNode-unsigned.ipa;type=application/octet-stream"
