name: Telegram Test Message

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send-test-message:
    name: Send approved CIE test message
    runs-on: ubuntu-latest
    steps:
      - name: Send message to CIE Telegram bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          test -n "$TELEGRAM_BOT_TOKEN" || { echo "Missing TELEGRAM_BOT_TOKEN secret"; exit 1; }
          test -n "$TELEGRAM_CHAT_ID" || { echo "Missing TELEGRAM_CHAT_ID secret"; exit 1; }
          curl --fail --silent --show-error \
            --request POST \
            --data-urlencode "chat_id=$TELEGRAM_CHAT_ID" \
            --data-urlencode "text=We are being born; 36 is LORD" \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage"
