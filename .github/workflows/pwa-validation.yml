name: PWA validation

on:
  pull_request:
    paths:
      - "pwa/**"
      - ".github/workflows/pwa-validation.yml"
  push:
    branches:
      - "main"
    paths:
      - "pwa/**"
      - ".github/workflows/pwa-validation.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: node --check pwa/app.js && node --check pwa/sw.js
      - name: Validate manifest and required assets
        run: |
          node -e "const fs=require('fs'); const m=JSON.parse(fs.readFileSync('pwa/manifest.webmanifest','utf8')); if(!m.name || !m.start_url || !m.icons?.length) process.exit(1)"
          test -s pwa/index.html
          test -s pwa/styles.css
          test -s pwa/icons/icon.svg
          grep -q 'serviceWorker' pwa/app.js
      - name: Verify API responses are never intercepted by the service worker
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const vm = require("node:vm");
          const handlers = {};
          const cache = {
            addAll: async () => {},
            match: async () => undefined,
            put: async () => {}
          };
          const self = {
            registration: { scope: "https://example.test/" },
            addEventListener: (name, handler) => { handlers[name] = handler; }
          };
          const context = {
            self,
            URL,
            caches: {
              open: async () => cache,
              keys: async () => ["old-cache", "36os-mobile-node-shell-v2"],
              delete: async () => true
            },
            fetch: async () => ({ ok: true, clone: () => ({}) })
          };
          vm.runInNewContext(fs.readFileSync("pwa/sw.js", "utf8"), context);
          for (const url of [
            "https://example.test/v1/agents/identity",
            "https://example.test/v1/36os/knowledge/health"
          ]) {
            let intercepted = false;
            handlers.fetch({
              request: { method: "GET", url },
              respondWith: () => { intercepted = true; }
            });
            if (intercepted) throw new Error("Service worker intercepted API response: " + url);
          }
          let staticAssetIntercepted = false;
          handlers.fetch({
            request: { method: "GET", url: "https://example.test/index.html" },
            respondWith: () => { staticAssetIntercepted = true; }
          });
          if (!staticAssetIntercepted) throw new Error("Static app shell is not cache-enabled");
          console.log("Service worker caches static assets only; API requests bypass it.");
          NODE
